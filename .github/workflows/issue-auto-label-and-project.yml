name: 이슈 자동화

on:
  issues:
    types: [ opened ]

jobs:
  automate-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      # === 자동 라벨 할당 (컨벤션 문서의 12개 타입 기준) ===
      - name: "feat 라벨 할당"
        if: contains(github.event.issue.title, 'feat')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: feat

      - name: "fix 라벨 할당"
        if: contains(github.event.issue.title, 'fix')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: fix

      - name: "docs 라벨 할당"
        if: contains(github.event.issue.title, 'docs')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: docs

      - name: "style 라벨 할당"
        if: contains(github.event.issue.title, 'style')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: style

      - name: "refactor 라벨 할당"
        if: contains(github.event.issue.title, 'refactor')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: refactor

      - name: "test 라벨 할당"
        if: contains(github.event.issue.title, 'test')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: test

      - name: "chore 라벨 할당"
        if: contains(github.event.issue.title, 'chore')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: chore

      # === GitHub Project 자동 추가 ===
      # project-url은 Team-MyPik의 실제 프로젝트 보드 URL로 바꿔주세요
      - name: 이슈를 프로젝트의 Backlog 컬럼에 추가
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: "https://github.com/users/eunchan96/projects/5"
          github-token: ${{ secrets.BNOTE_ACCESS_TOKEN }}
